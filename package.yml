package: upkeep
version: '3.0.2'
author: KLXM Crossmedia
supportpage: https://github.com/klxm/upkeep
load: late
title: 'translate:upkeep_title'
perm: upkeep[]

page:
    title: 'translate:upkeep_title'
    perm: upkeep[]
    prio: 200
    block: system
    icon: 'rex-icon fa fa-wrench'
    subpages:
        dashboard:
            title: 'translate:upkeep_nav_dashboard'
            icon: 'rex-icon fa fa-th-large'
            perm: upkeep[]
        maintenance:
            title: 'translate:upkeep_nav_maintenance'
            icon: 'rex-icon fa fa-power-off'
            perm: upkeep[]
            subpages:
                status: {title: 'translate:upkeep_nav_maintenance_status', icon: 'rex-icon fa fa-toggle-on', perm: 'upkeep[maintenance]'}
                domains: {title: 'translate:upkeep_nav_maintenance_domains', icon: 'rex-icon fa fa-sitemap', perm: 'upkeep[domains]'}
                redirects: {title: 'translate:upkeep_nav_maintenance_redirects', icon: 'rex-icon fa fa-share', perm: 'upkeep[domain_mapping]'}
        protection:
            title: 'translate:upkeep_nav_protection'
            icon: 'rex-icon fa fa-shield'
            perm: upkeep[]
            subpages:
                events: {title: 'translate:upkeep_nav_protection_events', icon: 'rex-icon fa fa-list', perm: 'upkeep[ips]'}
                stats: {title: 'translate:upkeep_nav_protection_stats', icon: 'rex-icon fa fa-bar-chart', perm: admin}
                blocked: {title: 'translate:upkeep_nav_protection_blocked', icon: 'rex-icon fa fa-ban', perm: 'upkeep[ips]'}
                allowlist: {title: 'translate:upkeep_nav_protection_allowlist', icon: 'rex-icon fa fa-check-circle', perm: 'upkeep[ips]'}
                patterns: {title: 'translate:upkeep_nav_protection_patterns', icon: 'rex-icon fa fa-code', perm: 'upkeep[ips]'}
                forms: {title: 'translate:upkeep_nav_protection_forms', icon: 'rex-icon fa fa-wpforms', perm: 'upkeep[forms]'}
                mail: {title: 'translate:upkeep_nav_protection_mail', icon: 'rex-icon fa fa-envelope-o', perm: 'upkeep[mail_security]'}
        advisor:
            title: 'translate:upkeep_nav_advisor'
            icon: 'rex-icon fa fa-lightbulb-o'
            perm: upkeep[advisor]
        storage:
            title: 'translate:upkeep_nav_storage'
            icon: 'rex-icon fa fa-hdd-o'
            perm: upkeep[]
        settings:
            title: 'translate:upkeep_nav_settings'
            icon: 'rex-icon fa fa-sliders'
            perm: admin
        help:
            title: 'translate:help'
            subPath: README.md
            itemClass: 'pull-right'
            icon: 'rex-icon fa fa-question-circle'

requires:
    redaxo: ^5.18.1
    php: '>=8.2'

suggests:
    cronjob: '^2.8'

permissions:
    upkeep[]: 'translate:upkeep_perm_base'
    upkeep[maintenance]: 'translate:upkeep_perm_maintenance'
    upkeep[domains]: 'translate:upkeep_perm_domains'
    upkeep[domain_mapping]: 'translate:upkeep_perm_domain_mapping'
    upkeep[ips]: 'translate:upkeep_perm_ips'
    upkeep[forms]: 'translate:upkeep_perm_forms'
    upkeep[mail_security]: 'translate:upkeep_perm_mail_security'
    upkeep[advisor]: 'translate:upkeep_perm_advisor'
    upkeep[reporting]: 'translate:upkeep_perm_reporting'

console_commands:
    upkeep:mode: rex_upkeep_mode_command
    upkeep:ips:cleanup: rex_upkeep_ips_cleanup_command
    upkeep:security:scan: rex_upkeep_security_scan_command
    upkeep:mail-reporting:send-bundle: rex_upkeep_mail_reporting_bundle_command
    upkeep:storage: rex_upkeep_storage_command

default_config:
    frontend_active: 0
    backend_active: 0
    allowed_ips: ''
    bypass_logged_in: 1
    http_status_code: 503
    retry_after: 3600
    all_domains_locked: false
    trusted_proxies: ''
    ips_active: 1
    ips_unlock_max: 3
    ips_unlock_hours: 24
    mail_security_active: 0
    form_protection_active: 0
    advisor_active: 1
    admin_release_days: 30
